<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with rounded corners -->
  <rect width="1024" height="1024" fill="#FFFFFF" rx="180"/>
  
  <!-- Gradient definitions -->
  <defs>
    <linearGradient id="mainGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E40AF;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bgCircle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#DBEAFE;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#93C5FD;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="512" cy="512" r="420" fill="url(#bgCircle)"/>
  
  <!-- AI Neural Network (Top) -->
  <g transform="translate(512, 320)">
    <!-- Connection lines -->
    <g opacity="0.8">
      <line x1="0" y1="0" x2="-80" y2="-60" stroke="#3B82F6" stroke-width="8" stroke-linecap="round"/>
      <line x1="0" y1="0" x2="80" y2="-60" stroke="#3B82F6" stroke-width="8" stroke-linecap="round"/>
      <line x1="0" y1="0" x2="0" y2="-80" stroke="#3B82F6" stroke-width="8" stroke-linecap="round"/>
      <line x1="0" y1="0" x2="-100" y2="20" stroke="#3B82F6" stroke-width="8" stroke-linecap="round"/>
      <line x1="0" y1="0" x2="100" y2="20" stroke="#3B82F6" stroke-width="8" stroke-linecap="round"/>
    </g>
    
    <!-- Nodes -->
    <circle cx="-80" cy="-60" r="18" fill="#FFFFFF" stroke="#3B82F6" stroke-width="4"/>
    <circle cx="80" cy="-60" r="18" fill="#FFFFFF" stroke="#3B82F6" stroke-width="4"/>
    <circle cx="0" cy="-80" r="18" fill="#FFFFFF" stroke="#3B82F6" stroke-width="4"/>
    <circle cx="-100" cy="20" r="18" fill="#FFFFFF" stroke="#3B82F6" stroke-width="4"/>
    <circle cx="100" cy="20" r="18" fill="#FFFFFF" stroke="#3B82F6" stroke-width="4"/>
    
    <!-- Central node (larger) -->
    <circle cx="0" cy="0" r="35" fill="url(#mainGradient)"/>
    <circle cx="0" cy="0" r="25" fill="#FFFFFF" opacity="0.3"/>
  </g>
  
  <!-- Briefcase Icon (Bottom) -->
  <g transform="translate(512, 620)">
    <!-- Main briefcase body -->
    <rect x="-140" y="-70" width="280" height="180" rx="20" fill="url(#mainGradient)"/>
    
    <!-- Briefcase top edge highlight -->
    <rect x="-140" y="-70" width="280" height="30" rx="20" fill="#FFFFFF" opacity="0.2"/>
    
    <!-- Handle -->
    <path d="M -70 -70 L -70 -100 Q -70 -120 -50 -120 L 50 -120 Q 70 -120 70 -100 L 70 -70" 
          fill="none" stroke="url(#mainGradient)" stroke-width="12" stroke-linecap="round"/>
    
    <!-- Lock detail -->
    <rect x="-15" y="10" width="30" height="35" rx="4" fill="#FFFFFF" opacity="0.3"/>
    <circle cx="0" cy="27" r="8" fill="#FFFFFF" opacity="0.8"/>
    
    <!-- Side panels -->
    <rect x="-140" y="-40" width="30" height="120" fill="#1E40AF" opacity="0.3"/>
    <rect x="110" y="-40" width="30" height="120" fill="#1E40AF" opacity="0.3"/>
  </g>
  
  <!-- Connecting element between AI and briefcase -->
  <g transform="translate(512, 460)">
    <circle cx="0" cy="0" r="12" fill="#3B82F6" opacity="0.6"/>
    <line x1="0" y1="-100" x2="0" y2="90" stroke="#3B82F6" stroke-width="6" stroke-dasharray="10,10" opacity="0.4"/>
  </g>
</svg>
