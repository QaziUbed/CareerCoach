<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1024" height="1024" fill="#FFFFFF" rx="180"/>
  
  <!-- Gradient Background Circle -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#1E40AF;stop-opacity:0.1" />
    </linearGradient>
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E40AF;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <circle cx="512" cy="512" r="400" fill="url(#bgGradient)"/>
  
  <!-- Briefcase Icon -->
  <g transform="translate(512, 580)">
    <!-- Briefcase body -->
    <rect x="-160" y="-80" width="320" height="200" rx="20" fill="url(#iconGradient)"/>
    
    <!-- Briefcase handle -->
    <path d="M -80 -80 L -80 -120 Q -80 -140 -60 -140 L 60 -140 Q 80 -140 80 -120 L 80 -80" 
          fill="url(#iconGradient)" stroke="url(#iconGradient)" stroke-width="8"/>
    
    <!-- Briefcase lock -->
    <rect x="-20" y="20" width="40" height="40" rx="5" fill="#FFFFFF" opacity="0.3"/>
    <circle cx="0" cy="40" r="8" fill="#FFFFFF"/>
  </g>
  
  <!-- AI Brain/Circuit Pattern -->
  <g transform="translate(512, 340)">
    <!-- Central node -->
    <circle cx="0" cy="0" r="30" fill="url(#iconGradient)"/>
    
    <!-- Neural network connections -->
    <g opacity="0.6">
      <!-- Top connections -->
      <line x1="0" y1="-30" x2="-60" y2="-80" stroke="#3B82F6" stroke-width="6" stroke-linecap="round"/>
      <line x1="0" y1="-30" x2="60" y2="-80" stroke="#3B82F6" stroke-width="6" stroke-linecap="round"/>
      <line x1="0" y1="-30" x2="0" y2="-100" stroke="#3B82F6" stroke-width="6" stroke-linecap="round"/>
      
      <!-- Side connections -->
      <line x1="-30" y1="0" x2="-90" y2="0" stroke="#3B82F6" stroke-width="6" stroke-linecap="round"/>
      <line x1="30" y1="0" x2="90" y2="0" stroke="#3B82F6" stroke-width="6" stroke-linecap="round"/>
    </g>
    
    <!-- Outer nodes -->
    <circle cx="-60" cy="-80" r="15" fill="#3B82F6"/>
    <circle cx="60" cy="-80" r="15" fill="#3B82F6"/>
    <circle cx="0" cy="-100" r="15" fill="#3B82F6"/>
    <circle cx="-90" cy="0" r="15" fill="#3B82F6"/>
    <circle cx="90" cy="0" r="15" fill="#3B82F6"/>
    
    <!-- Inner glow on central node -->
    <circle cx="0" cy="0" r="20" fill="#FFFFFF" opacity="0.3"/>
  </g>
  
  <!-- Subtle text (optional) -->
  <text x="512" y="920" font-family="Arial, sans-serif" font-size="60" font-weight="bold" 
        text-anchor="middle" fill="#3B82F6" opacity="0.4">CAREER COACH</text>
</svg>
